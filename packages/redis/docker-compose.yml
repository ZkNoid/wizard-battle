services:
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - '6379:6379'
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - bridge

  redis-tournament:
    image: redis:latest
    container_name: redis-tournament-server
    ports:
      - '6380:6379'
    volumes:
      - ./redis-tournament-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - bridge

networks:
  bridge:
    driver: bridge
