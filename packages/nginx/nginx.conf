events {}

http {

# Trust Cloudflare edge proxies and restore the original visitor IP before
# proxying to NestJS. This makes $remote_addr safe to forward as X-Real-IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nestjs-main-us {
    server nestjs-main:3030 weight=5;
#    server nestjs-app2:3030 max_fails=3 fail_timeout=30s;
#    server nestjs-app2:3030 backup;
    keepalive 32;
}

upstream nestjs-dev-us {
    server nestjs-dev:3031 weight=5;
#    server nestjs-app2:3030 max_fails=3 fail_timeout=30s;
#    server nestjs-app2:3030 backup;
    keepalive 32;
}

server {
    listen 443 http2 ssl;
   #listen [::]:443 http2 ssl;

   server_name prod-api-wizard.zknoid.io;

   ssl_certificate /etc/nginx/ssl/origin.crt;
   ssl_certificate_key /etc/nginx/ssl/origin.key;
   #ssl_dhparam /etc/ssl/certs/dhparam.pem;
   #ssl_trusted_certificate /etc/ssl/certs/nginx-signed.ca-bundle;

    ########################################################################
    # from https://cipherli.st/                                            #
    # and https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html #
    ########################################################################

    ssl_protocols TLSv1.2; #TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    #resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
    resolver 77.88.8.8 77.88.8.1 valid=300s ipv6=off;
    resolver_timeout 5s;



    index index.html;
    error_log  /var/log/nginx/error.log;

#    location /favicon.ico {
#
#	alias /usr/share/nginx/html/favicon.png;
#   }

    location /tournament {
        proxy_pass http://nestjs-main:3032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }

    location / {
        #proxy_pass http://172.17.0.4:3000;
        proxy_pass http://nestjs-main-us;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        #proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
    root /usr/share/nginx/html;

    error_page 404 /404.html;

    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
    }

 }

