name: Build & Deploy Docker Image

on:
  push:
    branches:
      - main
      - dev
jobs:
  test-build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Cache Turborepo build outputs
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
            **/node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
          SPELL_CAST_TIMEOUT: ${{ secrets.SPELL_CAST_TIMEOUT }}
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
          NEXT_PUBLIC_PROJECT_URL: ${{ secrets.NEXT_PUBLIC_PROJECT_URL }}
          NEXT_PUBLIC_GAME_REGISTRY_ADDRESS: ${{ secrets.NEXT_PUBLIC_GAME_REGISTRY_ADDRESS }}
          EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
          ENVIO_GRAPHQL_URL: ${{ secrets.ENVIO_GRAPHQL_URL }}
        run: pnpm turbo run build
  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Trigger Vercel Deploy Hook
        if: needs.test-build.result == 'success'
        env:
          DEPLOY_HOOKS: '{"main": "https://api.vercel.com/v1/integrations/deploy/prj_C1HUgN5FZYWAVc6rLyg0su57Miui/Mr2uYTmBav", "dev": "https://api.vercel.com/v1/integrations/deploy/prj_C1HUgN5FZYWAVc6rLyg0su57Miui/eVHIfTAoWi"}'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BRANCH=${{ github.ref_name }}
          HOOK_URL=$(echo "$DEPLOY_HOOKS" | jq -r ".[\"$BRANCH\"]")
          if [ -n "$HOOK_URL" ]; then
            curl -X POST "$HOOK_URL"
            echo "Triggered deployment for $BRANCH"
            if [ -z "$TELEGRAM_TOKEN" ]; then
              echo "Error: TELEGRAM_TOKEN is empty"
            else
              echo "TELEGRAM_TOKEN is set (length: ${#TELEGRAM_TOKEN})"
            fi
            ESCAPED_COMMIT_MESSAGE=$(echo "$COMMIT_MESSAGE" | sed 's/"/\\"/g; s/\\/\\\\/g; s/&/%26/g; s/=/\\=/g')
            if [ "${{ needs.test-build.result }}" == "success" ]; then
              MESSAGE="New power has awakened in the $BRANCH land. Be aware: $ESCAPED_COMMIT_MESSAGE"
            else
              MESSAGE="⚠️ Test build failed in the $BRANCH land! Deployment blocked. Error: $ESCAPED_COMMIT_MESSAGE"
            fi
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id=$TELEGRAM_CHAT_ID -d text="$MESSAGE")
            echo "Telegram API response: $RESPONSE"
            echo "Triggered telegram message for $BRANCH"
          else
            echo "No Deploy Hook configured for $BRANCH"
          fi

      - name: Send failure notification
        if: needs.test-build.result != 'success'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BRANCH=${{ github.ref_name }}
          ESCAPED_COMMIT_MESSAGE=$(echo "$COMMIT_MESSAGE" | sed 's/"/\\"/g; s/\\/\\\\/g; s/&/%26/g; s/=/\\=/g')
          MESSAGE="⚠️ Test build failed in the $BRANCH land! Deployment blocked. Commit: $ESCAPED_COMMIT_MESSAGE"
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id=$TELEGRAM_CHAT_ID -d text="$MESSAGE")
          echo "Telegram API response: $RESPONSE"

  copy-redis-config:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy redis.conf to remote server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'packages/redis/redis.conf'
          target: ${{ secrets.TARGET_PATH }}
          strip_components: 1

  copy-nginx-config:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy nginx.conf to remote server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'packages/nginx/nginx.conf'
          target: ${{ secrets.TARGET_PATH }}
          strip_components: 1

  copy-server-config:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy docker-compose.yml to remote server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'packages/server/docker-compose.yml'
          target: ${{ secrets.TARGET_PATH }}
          strip_components: 2

  copy-mongodb-backup-script:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy mongodb-backup.sh to remote server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'packages/server/scripts/mongodb-backup.sh'
          target: ${{ secrets.TARGET_PATH }}
          strip_components: 2

  build-and-deploy:
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      DEPLOY_CONTAINER: '{"main": "nestjs-main", "dev": "nestjs-dev"}'
      APP_PORT: '{"main": "3030", "dev": "3031"}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate deploy container name
        id: calc-container
        run: |
          BRANCH=${{ github.ref_name }}
          DEPLOY_CONTAINER=$(echo "$DEPLOY_CONTAINER" | jq -r ".[\"$BRANCH\"]")
          echo "container_name=$DEPLOY_CONTAINER" >> $GITHUB_OUTPUT
          APP_PORT=$(echo "$APP_PORT" | jq -r ".[\"$BRANCH\"]")
          echo "app_port=$APP_PORT" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.calc-container.outputs.container_name }}:latest
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MONGODB_DB=${{ secrets.MONGODB_DB }}
            APP_PORT=${{ steps.calc-container.outputs.app_port }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            WEBSOCKET_URL=${{ secrets.WEBSOCKET_URL }}
            SPELL_CAST_TIMEOUT=${{ secrets.SPELL_CAST_TIMEOUT }}
            MINA_NETWORK_URL=${{ secrets.MINA_NETWORK_URL }}
            MINA_ADMIN_PRIVATE_KEY=${{ secrets.MINA_ADMIN_PRIVATE_KEY }}
            MINA_CONTRACT_ADDRESS=${{ secrets.MINA_CONTRACT_ADDRESS }}
            BULLMQ_REDIS_HOST=${{ secrets.BULLMQ_REDIS_HOST }}
            BULLMQ_REDIS_PORT=${{ secrets.BULLMQ_REDIS_PORT }}
            EVM_RPC_URL=${{ secrets.EVM_RPC_URL }}
            GAME_SIGNER_PUBLIC_KEY=${{ secrets.GAME_SIGNER_PUBLIC_KEY }}
            GAME_SIGNER_PRIVATE_KEY=${{ secrets.GAME_SIGNER_PRIVATE_KEY }}
            GAME_REGISTRY_ADDRESS=${{ secrets.GAME_REGISTRY_ADDRESS }}
            WB_RESOURCES_ADDRESS=${{ secrets.WB_RESOURCES_ADDRESS }}
            WB_CHARACTER_ADDRESS=${{ secrets.WB_CHARACTER_ADDRESS }}
            WB_COINS_ADDRESS=${{ secrets.WB_COINS_ADDRESS }}
            WB_ITEMS_ADDRESS=${{ secrets.WB_ITEMS_ADDRESS }}
            GAME_MARKET_ADDRESS=${{ secrets.GAME_MARKET_ADDRESS }}
            RPC_WS_URL=${{ secrets.RPC_WS_URL }}
            GAME_MARKET_DEPLOYMENT_BLOCK=${{ secrets.GAME_MARKET_DEPLOYMENT_BLOCK }}
            TOURNAMENT_APP_PORT=${{ secrets.TOURNAMENT_APP_PORT }}
            TOURNAMENT_CONTRACT_ADDRESS=${{ secrets.TOURNAMENT_CONTRACT_ADDRESS }}
            TOURNAMENT_REDIS_URL=${{ secrets.TOURNAMENT_REDIS_URL }}
            TOURNAMENT_ADMIN_PRIVATE_KEY=${{ secrets.TOURNAMENT_ADMIN_PRIVATE_KEY }}
            MINA_GRAPHQL_URL=${{ secrets.MINA_GRAPHQL_URL }}
            MINA_ARCHIVE_URL=${{ secrets.MINA_ARCHIVE_URL }}

      - name: Save Docker image to tar
        run: |
          docker save ${{ steps.calc-container.outputs.container_name }}:latest -o ${{ steps.calc-container.outputs.container_name }}.tar
          chmod 644 ${{ steps.calc-container.outputs.container_name }}.tar

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy image to remote server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: '${{ steps.calc-container.outputs.container_name }}.tar'
          target: ${{ secrets.TARGET_PATH }}

      - name: SSH into server, regenerate .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.TARGET_PATH }}

            # === Ensure required directories exist ===
            mkdir -p backups scripts
            chmod 755 backups scripts
            chown -R docker:docker backups scripts

            # === Regenerate .env securely ===
            cat > .env << 'EOT'
            MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOT

            chmod 600 .env

            # === Deploy ===
            docker system prune -f
            docker load -i ${{ steps.calc-container.outputs.container_name }}.tar

            docker stop ${{ steps.calc-container.outputs.container_name }} || true
            docker rm ${{ steps.calc-container.outputs.container_name }} || true

            docker compose up -d
            sleep 30
            docker compose restart nginx

            echo "Deployment complete!"
            docker compose ps
